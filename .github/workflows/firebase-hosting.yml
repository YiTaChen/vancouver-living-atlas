name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, verify, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://vancouver-living-atlas-yita.web.app
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run check
          npm test

      - name: Build Firebase Hosting bundle
        run: npm run build:firebase

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.32.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: vancouver-living-atlas-yita
          workload_identity_provider: projects/479560564717/locations/global/workloadIdentityPools/github-actions/providers/vancouver-living-atlas
          service_account: firebase-hosting-deployer@vancouver-living-atlas-yita.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy Firebase Hosting
        run: >-
          firebase deploy
          --only hosting
          --project vancouver-living-atlas-yita
          --non-interactive
